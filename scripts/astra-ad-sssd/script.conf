#Файл script.conf используется для указания переменных, из файла скрипта sendcommand, которые вы хотите иметь возможность менять в копии скрипта при отправке (т.е. нет необходимости менять значения в эталонном файле скрипта вручную).

#При подготовке файлов к отправке, если файл script.conf есть в каталоге с отправляемым скриптом, будет задан вопрос, хотите ли вы внести изменения в переменные копии файла отправляемого скрипта (вопрос можно отключить через параметр skipchangescriptfile в sssc.conf).

#Вопросы задаются в порядке расположения секций в файле. Учитывайте это при использовании block_changes_values и terms_block_changes_curent_variable

#Формат заполнения
#[имя-переменной]
#typevalue=тип-переменной
#descvalue=Описание
#listvalue=значение1;значение2
#block_changes_values=значение-текущей-переменной1:имя-блокируемой-переменной1;имя-блокируемой-переменной2|значение-текущей-переменной2:имя-блокируемой-переменной1;имя-блокируемой-переменной2
#terms_block_changes_curent_variable=проверяемое-значение1:имя-проверяемой-переменной1;имя-проверяемой-переменной2|проверяемое-значение2:имя-проверяемой-переменной1;имя-проверяемой-переменной2

#Поле listvalue обязательно, если выбран тип переменной list

#terms_block_changes_curent_variable - необязательное поле, позволяющее указать условия, при которых вопрос не будет задан для текущей переменной. В проверяемом значении также можно указать not_null для проверки текстового поля, что оно не пустое.

#block_changes_values - необязательное поле, которое позволяет указать, для каких переменных не задавать вопрос об изменении, если значение текущей переменной соответствует указанному значению/условию. В значении текущей переменной также можно указать not_null для проверки текстового поля, что оно не пустое.

#Допускается использовать следующие типы переменной:
#number - любое число
#text - текстовое поле
#list - выбор из заданного списка значений
#massive - при выборе данного типа будет запрос значений для массива
#truefalse - выбор из значений 0/1

[input_in_domain]
typevalue=truefalse
descvalue=Выполнить блок введения устройства в домен (Для включения выбрать 1)
block_changes_values=1:exit_domain|0:domain_name;dc_name;ip_adress;ntp_server;forceyes;no_create_hosts_and_smb;use_fullnames;inst_fly_admin_ad_sssd_client

[exit_domain]
typevalue=truefalse
descvalue=Выполнить блок отключения устройства от домена (Для включения выбрать 1)
block_changes_values=1:domain_name;dc_name;ip_adress;ntp_server;forceyes;no_create_hosts_and_smb;use_fullnames;inst_fly_admin_ad_sssd_client

[domain_name]
typevalue=text
descvalue=Имя домена (Обязательная переменная для выполнения команды)
terms_block_changes_curent_variable=0:input_in_domain

[admin_name]
typevalue=text
descvalue=Имя администратора (Обязательная переменная для выполнения команды)
terms_block_changes_curent_variable=0:input_in_domain;exit_domain

[dc_name]
typevalue=text
descvalue=Имя контроллера домена
terms_block_changes_curent_variable=0:input_in_domain

[ip_adress]
typevalue=text
descvalue=IP адрес. Если заполнено, то команде будет передан параметр -ip с указанным ip адресом
terms_block_changes_curent_variable=0:input_in_domain

[ntp_server]
typevalue=text
descvalue=Если заполнено, то команде передается параметр -n. Задать адрес сервера точного времени (NTP). Если не задан, то в качестве сервера точного времени будет использоваться контроллер домена.
terms_block_changes_curent_variable=0:input_in_domain

[forceyes]
typevalue=truefalse
descvalue=Отключить запрос подтверждения (Для передачи параметра -y выбрать 1)
terms_block_changes_curent_variable=0:input_in_domain

[no_create_hosts_and_smb]
typevalue=truefalse
descvalue=Не создавать новый hosts и smb.conf (для передачи параметра -c команде, выберите 1)
terms_block_changes_curent_variable=0:input_in_domain

[use_fullnames]
typevalue=truefalse
descvalue=Использовать полные доменные имена (1-полные; 0-короткие)
terms_block_changes_curent_variable=0:input_in_domain

[inst_fly_admin_ad_sssd_client]
typevalue=truefalse
descvalue=Установить fly-admin-ad-sssd-client (Для включения выбрать 1)
terms_block_changes_curent_variable=0:input_in_domain
